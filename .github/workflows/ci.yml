name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Type check (server, dashboard, game scripts are checked with Creator's typings locally)
        run: |
          npm run typecheck -w server
          npm run typecheck -w dashboard
      - name: Server tests (in-memory MongoDB replica set)
        run: npm test
      - name: Build the dashboard
        run: npm run build -w dashboard
      - name: AI documentation is up to date
        run: |
          npm run build:ai-docs
          git diff --exit-code -- server/public/llms.txt server/public/llms-full.txt server/public/postman.json server/public/docs/ai \
            || (echo "Run 'npm run build:ai-docs' and commit the result" && exit 1)
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
